[project]
name = "voice-clone-detector"
version = "0.1.0"
description = "Real-time detection and prevention of voice-cloning impersonation attacks"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Voice Clone Detector Team"},
]

dependencies = [
    "torch>=2.1.0",
    "torchaudio>=2.1.0",
    "speechbrain>=1.0.0",
    "transformers>=4.40.0",   # wav2vec2 spoof classifier
    "imageio-ffmpeg>=0.5.0",  # decodes M4A/AAC that libsndfile cannot
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
    "praat-parselmouth>=0.4.3",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "websockets>=12.0",
    "python-multipart>=0.0.9",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
    "black>=24.0.0",
]
training = [
    "jupyter>=1.0.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "scikit-learn>=1.4.0",
    "tqdm>=4.66.0",
    "tensorboard>=2.16.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
